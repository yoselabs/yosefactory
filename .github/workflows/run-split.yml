# .github/workflows/run-split.yml
# Reusable workflow: engine run for Mode 1 (Jira dispatcher).
# Inputs are set by the dispatcher's workflow_dispatch call.

name: a2sdlc — run (split)

on:
  workflow_call:
    inputs:
      ticket_key:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_hmac:
        required: true
        type: string
      dispatcher_url:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: main
      ticket_body:
        required: false
        type: string
        default: ""
      trigger_stage:
        required: false
        type: string
        default: "spec"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      MLFLOW_TRACKING_URI:
        required: false
      MLFLOW_TRACKING_USERNAME:
        required: false
      MLFLOW_TRACKING_PASSWORD:
        required: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      TICKET_KEY: ${{ inputs.ticket_key }}
      TICKET_BODY: ${{ inputs.ticket_body }}
      RUN_ID: ${{ inputs.run_id }}
      RUN_HMAC: ${{ inputs.run_hmac }}
      DISPATCHER_URL: ${{ inputs.dispatcher_url }}
      A2SDLC_TRIGGER_STAGE: ${{ inputs.trigger_stage }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      GITHUB_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}
      - uses: astral-sh/setup-uv@v4
      - name: Install engine
        run: |
          uv tool install --from 'git+https://github.com/yoselabs/a2sdlc@main#subdirectory=packages/engine' a2sdlc-engine
      - name: Dispatch
        run: a2sdlc dispatch
