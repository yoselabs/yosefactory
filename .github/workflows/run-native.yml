# .github/workflows/run-native.yml
# Reusable workflow: runs `a2sdlc dispatch` on a single GitHub event.
# Consumer workflows pass the event context through and provide secrets.

name: a2sdlc — run (native)

on:
  workflow_call:
    secrets:
      A2SDLC_APP_ID:
        required: true
      A2SDLC_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      MLFLOW_TRACKING_URI:
        required: false
      MLFLOW_TRACKING_USERNAME:
        required: false
      MLFLOW_TRACKING_PASSWORD:
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push branches
      issues: write          # comment, label, close
      pull-requests: write   # open/update PRs, review comments
      checks: write          # check-run annotations (if the engine posts any)
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.A2SDLC_APP_ID }}
          private-key: ${{ secrets.A2SDLC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git author
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BOT_ID=$(gh api "/users/a2sdlc%5Bbot%5D" --jq .id 2>/dev/null || echo "0")
          git config user.name "a2sdlc[bot]"
          git config user.email "${BOT_ID}+a2sdlc[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install engine
        run: |
          uv tool install --from 'git+https://github.com/yoselabs/a2sdlc@feat/mode2-smoke-telemetry#subdirectory=packages/engine' a2sdlc-engine
          # TEMP for smoke: pin to feat branch and subdirectory.
          # Reset to '@main' when feat/mode2-smoke-telemetry merges.

      - name: Dispatch
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: a2sdlc dispatch
