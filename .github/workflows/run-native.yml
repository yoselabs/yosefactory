# .github/workflows/run-native.yml
# Reusable workflow: runs `a2sdlc dispatch` on a single GitHub event.
# Consumer workflows pass the event context through and provide secrets.

name: a2sdlc — run (native)

on:
  workflow_call:
    secrets:
      A2SDLC_APP_ID:
        required: true
      A2SDLC_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      MLFLOW_TRACKING_URI:
        required: false
      MLFLOW_TRACKING_USERNAME:
        required: false
      MLFLOW_TRACKING_PASSWORD:
        required: false

concurrency:
  # Serialize all dispatch runs for a single issue/PR. Multiple rapid
  # triggers queue rather than race. cancel-in-progress=false because
  # mid-flight stages shouldn't be killed when a new event arrives —
  # they're part of the state machine's valid progression.
  group: a2sdlc-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Skip bot-authored comment triggers — the engine's own comments would
    # otherwise fire the same stage again, doubling work per stage.
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push branches
      issues: write          # comment, label, close
      pull-requests: write   # open/update PRs, review comments
      checks: write          # check-run annotations (if the engine posts any)
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.A2SDLC_APP_ID }}
          private-key: ${{ secrets.A2SDLC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git author
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BOT_ID=$(gh api "/users/a2sdlc%5Bbot%5D" --jq .id 2>/dev/null || echo "0")
          git config user.name "a2sdlc[bot]"
          git config user.email "${BOT_ID}+a2sdlc[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Mint engine-install token
        # Cross-scope token for cloning yoselabs/a2sdlc. The main app-token
        # above is scoped to the consumer repo; this one is scoped to the
        # engine repo (read-only). Works against both public and private
        # visibility — over-specifies on public, required on private.
        # Prereq: the a2sdlc GitHub App must be installed on yoselabs org
        # with Contents: Read on the a2sdlc repo.
        id: engine-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.A2SDLC_APP_ID }}
          private-key: ${{ secrets.A2SDLC_APP_PRIVATE_KEY }}
          owner: yoselabs
          repositories: a2sdlc

      - name: Install engine
        env:
          ENGINE_TOKEN: ${{ steps.engine-token.outputs.token }}
        run: |
          uv tool install --from "git+https://x-access-token:${ENGINE_TOKEN}@github.com/yoselabs/a2sdlc@main#subdirectory=packages/engine" a2sdlc-engine

      - name: Install plugins
        # Skills/agents for the Claude Agent SDK runtime. SPEC/IMPLEMENT
        # prompts reference superpowers skills (brainstorming, writing-plans,
        # code-reviewer subagent); without the plugin loaded the agent
        # silently skips those phases. Pinned tag — bump with an engine
        # release, not tracking main.
        run: |
          mkdir -p /tmp/a2sdlc-plugins
          git clone --depth 1 --branch v5.0.7 \
            https://github.com/obra/superpowers.git \
            /tmp/a2sdlc-plugins/superpowers

      - name: Dispatch
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          # Plugin roots (colon-separated) passed to ClaudeAgentOptions.plugins.
          # Runner skips missing paths with a warning so local dev without
          # this step still works.
          A2SDLC_PLUGIN_PATHS: /tmp/a2sdlc-plugins/superpowers
        run: a2sdlc dispatch
