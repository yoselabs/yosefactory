[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2sdlc"
version = "0.1.0"
description = "Agent-to-SDLC — AI agent pipeline engine for automated software development"
requires-python = ">=3.12"
dependencies = ["jira>=3.10", "pyyaml>=6.0"]

[project.scripts]
a2sdlc = "a2sdlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2sdlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration"]
env = [
    "A2SDLC_TEST=1",
]

[dependency-groups]
dev = [
    "pytest-env>=1.6.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
