[project]
name = "a2factory"
version = "0.1.0"
description = "Personal workflow platform — process workflows for Denis's own software work, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Denis Tomilin"}]
keywords = ["mcp", "mcp-server", "model-context-protocol", "agent", "ai", "llm", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
]
dependencies = [
    # The harness. Claude Code packaged as a library: built-in file/bash/search
    # tools, the agent loop, context management, hooks, subagents, sessions.
    # NOT the Anthropic API SDK's `tool_runner` — different package, different
    # scope. Docs: code.claude.com/docs/en/agent-sdk
    "claude-agent-sdk",
    # The surface. Denis drives workflows from Claude Code / Claude Desktop, so
    # the platform is reachable as an MCP server. `~/Workspaces/a2skill` is the
    # working reference for packaging shape (server.json, stdio transport).
    "fastmcp>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
select = ["F", "S", "T10", "T20", "ASYNC", "E", "W", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
