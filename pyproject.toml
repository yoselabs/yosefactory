[project]
name = "yosefactory"
version = "0.1.0"
description = "Personal workflow platform — process workflows over any kind of work, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Denis Tomilin"}]
keywords = ["mcp", "mcp-server", "model-context-protocol", "agent", "ai", "llm", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
]
dependencies = [
    # The harness. Claude Code packaged as a library: built-in file/bash/search
    # tools, the agent loop, context management, hooks, subagents, sessions.
    # NOT the Anthropic API SDK's `tool_runner` — different package, different
    # scope. Docs: code.claude.com/docs/en/agent-sdk
    "claude-agent-sdk",
    # The surface. Denis drives workflows from Claude Code / Claude Desktop, so
    # the platform is reachable as an MCP server. `~/Workspaces/a2skill` is the
    # working reference for packaging shape (server.json, stdio transport).
    "fastmcp>=3.4,<4",
]

[project.scripts]
# Stable, absolute entrypoints after `uv sync` (`.venv/bin/<name>`) -- a scheduler invokes one of
# these directly, never `python -m yosefactory.runtime.loop` re-typed inside a plist, so it does
# not depend on the invoking environment's PYTHONPATH or shell profile to resolve the module.
yosefactory-loop = "yosefactory.runtime.loop:main"
# Same loop, but `--spend-ceiling-usd` is required (runtime.loop.main's own docstring explains
# why): the entrypoint a scheduler is configured to call, never one a person types by hand.
yosefactory-loop-scheduled = "yosefactory.runtime.loop:scheduled_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
select = ["F", "S", "T10", "T20", "ASYNC", "E", "W", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.yosefactory.guardrails]
# Tuning, not protocol: moving these does not make an existing turn record incomparable to an older
# one. `window` and `wall_clock_seconds` are GUESSES — there is no traffic yet to choose them from,
# and the posture is build the detector, learn the condition, decide the limit later (D021).
window = 10                 # turn records the stall detector examines
wall_clock_seconds = 2700   # well under CI's six-hour default, so the harness stop fires first
turn_ceiling = 40           # loop-runaway guard, NOT a spend cap; no executor ships a default
grace_seconds = 20          # after SIGTERM, before SIGKILL: the agent's chance to flush a verdict

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `live` drives the real pinned `claude` binary and spends real money. Excluded by default so a
# bare `make check` never bills anything, even accidentally, even repeatedly across a dev loop --
# recording the spend is not a substitute for this, because recording still lets every iteration of
# a dev loop bill money. Run explicitly with `make test-live`. Do not fold this back into the
# default selection to "simplify" the Makefile -- that is the exact regression this exists to close.
markers = [
    "live: drives the real pinned claude binary; costs real money; excluded from `make check`",
    "boardlive: touches a real GitHub repo over the network via gh; $0 in model spend (no executor runs) but mutates external state and needs gh auth, so it is excluded from make check on the same principle as live, for a different resource",
]
addopts = "-m 'not live and not boardlive'"

[tool.codespell]
# bench/corpus (source PDFs, binary) + bench/outputs (raw engine output, incl.
# scanned-page OCR text) are generated/fixture data, not authored content —
# real typos there are the engines' problem, not this repo's.
#
# tests/fixtures/*.html likewise: those are pages CAPTURED VERBATIM from live
# sites. Editing one to satisfy a spellchecker would make it a hand-written
# approximation — the precise defect dom-schema exists to prevent — so the
# fixture is authoritative and the linter yields to it, never the reverse.
skip = "uv.lock,.venv,.git,*.pyc,.ruff_cache,.pytest_cache"
# doctrine/glossary coinages the dictionary flags but we mean on purpose.
ignore-words-list = "wins,ontology,noqa"
check-filenames = ""

# yosefactory is single-package (src/yosefactory/), not a shelf-style packages/*/
# monorepo — deptry runs once from the root (see `make deps`), so it gets a real
# root [tool.deptry] block instead of shelf's per-package invocation.
[tool.deptry]
known_first_party = ["yosefactory"]

# ── coverage — measured on every `make test`; floor enforced (no silent rot) ───
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # protocol/abstract stubs
]
[dependency-groups]
# Shelf's linting preset (docs/linting.md), pruned to what this repo actually
# uses — dropped the shelf-package-specific test deps it ships with
# (browser-cookie3, python-docx, convert-md, anyllm, zendriver, hypothesis):
# none of those apply until a real consumer exists in this repo for them.
dev = [
    "pytest>=9.0.3,<10",  # >=9.0.3: GHSA-6w46-j5rx-g56g, insecure /tmp/pytest-of-{user} handling
    "pytest-cov>=6,<8",       # coverage measurement + floor
    "ruff>=0.7,<1",           # lint + format
    "ty>=0.0.1a8",            # type checking (Astral)
    "codespell>=2.3,<3",      # typos in code, docstrings, and docs
    "deptry>=0.20,<1",        # dependency hygiene: unused / missing / transitive
    "pytest-asyncio>=1.0,<2",  # async test support (the harness/MCP surface is async); >=1.0 for pytest 9 compat
]
