[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2sdlc"
version = "0.1.0"
description = "Agent-to-SDLC — AI agent pipeline engine for automated software development"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.50",
    "pydantic>=2.0",
    "rich>=14.0",
    "PyGithub>=2.6",
    "gitpython>=3.1",
    "tenacity>=8.0",
]

[project.scripts]
a2sdlc = "a2sdlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2sdlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration"]
env = [
    "A2SDLC_TEST=1",
]

[tool.ty.src]
# dispatch.py and test_dispatch.py are intentionally broken during Phase 2 migration;
# they will be rewritten in Phase 3.
exclude = ["src/a2sdlc/dispatch.py", "tests/test_dispatch.py", "tests/test_dispatch_auto_approve.py", "tests/test_stage_executor.py", "tests/test_state_manager.py"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.6.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]
