[project]
name = "a2sdlc-workspace"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit",
    "integration",
    "serial: test cannot run under pytest-xdist (shared global state); run in serial pass only",
]
env = ["A2SDLC_TEST=1"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "a2sdlc"

# Main layered contract — inward-only deps.
[[tool.importlinter.contracts]]
name = "Hexagonal layers (a2sdlc)"
type = "layers"
layers = [
    "a2sdlc.cli",
    "a2sdlc.pipeline",
    "a2sdlc.composition",
    "a2sdlc.ingress | a2sdlc.gating | a2sdlc.effects | a2sdlc.middleware | a2sdlc.stages",
    "a2sdlc.lifecycle | a2sdlc.observability | a2sdlc.evaluation | a2sdlc.assembly",
    "a2sdlc.adapters",
    "a2sdlc.config",
    "a2sdlc.domain",
]
# Pre-existing legitimate cross-layer imports. Each is either architecturally
# sanctioned by docs/architecture.md §2 or a known peer-tier-B cross the spec
# non-goal ("no 'while we're here' reshape") tells us to leave in place.
ignore_imports = [
    # config.py's lazy stage-registry lookup (get_stage inside a function).
    "a2sdlc.config -> a2sdlc.stages",
    # Arch §2: "Middleware may also import gating/" (idempotency → duplicate-run check).
    "a2sdlc.middleware.idempotency -> a2sdlc.gating",
    # Ingress orchestrates pre-stage breakers — peer-tier-B sanctioned call.
    "a2sdlc.ingress -> a2sdlc.gating",
]

# Peer-tier-A mutual isolation: lifecycle/assembly/evaluation/observability.
[[tool.importlinter.contracts]]
name = "lifecycle/assembly/evaluation/observability don't import from each other"
type = "independence"
modules = [
    "a2sdlc.lifecycle",
    "a2sdlc.assembly",
    "a2sdlc.evaluation",
    "a2sdlc.observability",
]

# Domain purity (non-negotiable).
[[tool.importlinter.contracts]]
name = "domain imports nothing from a2sdlc"
type = "forbidden"
source_modules = ["a2sdlc.domain"]
forbidden_modules = [
    "a2sdlc.cli",
    "a2sdlc.pipeline",
    "a2sdlc.composition",
    "a2sdlc.ingress",
    "a2sdlc.gating",
    "a2sdlc.effects",
    "a2sdlc.middleware",
    "a2sdlc.stages",
    "a2sdlc.lifecycle",
    "a2sdlc.observability",
    "a2sdlc.evaluation",
    "a2sdlc.assembly",
    "a2sdlc.adapters",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.6",
    "diff-cover>=9.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "import-linter>=2.0",
    "pytest-timeout>=2.4.0",
    "pytest-recording>=0.13",
]
