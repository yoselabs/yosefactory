[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2sdlc"
version = "0.1.0"
description = "Agent-to-SDLC — AI agent pipeline engine for automated software development"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.50",
    "pydantic>=2.0",
    "rich>=14.0",
    "PyGithub>=2.6",
    "gitpython>=3.1",
    "tenacity>=8.0",
    "python-ulid>=2.0",
    "mlflow>=2.15",
]

[project.scripts]
a2sdlc = "a2sdlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2sdlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration"]
env = [
    "A2SDLC_TEST=1",
]

[tool.ty.src]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "pytest-env>=1.6.0",
    "diff-cover>=9.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "import-linter>=2.0",
]

# ─── Architecture rules (enforced in CI) ────────────────────────────────
# Mirrors docs/architecture.md §2. Run locally with: uv run lint-imports
#
# We start with the one rule that matters most: domain purity. The rest are
# encoded as warnings for now (add when drift shows up in review).

[tool.importlinter]
root_packages = ["a2sdlc"]

[[tool.importlinter.contracts]]
name = "domain is pure (no imports from other a2sdlc packages)"
type = "forbidden"
source_modules = ["a2sdlc.domain"]
forbidden_modules = [
    "a2sdlc.adapters",
    "a2sdlc.pipeline",
    "a2sdlc.lifecycle",
    "a2sdlc.assembly",
    "a2sdlc.evaluation",
    "a2sdlc.stages",
    "a2sdlc.cli",
    "a2sdlc.config",
]

[[tool.importlinter.contracts]]
name = "adapters do not import application layer"
type = "forbidden"
source_modules = ["a2sdlc.adapters"]
forbidden_modules = [
    "a2sdlc.pipeline",
    "a2sdlc.lifecycle",
    "a2sdlc.assembly",
    "a2sdlc.evaluation",
    "a2sdlc.stages",
    "a2sdlc.cli",
]
ignore_imports = [
    # config.py is a glue point (docs/architecture.md §6) — it lazy-imports
    # stages to merge stage defaults with project overrides. Legit, bounded.
    "a2sdlc.config -> a2sdlc.stages",
    # subscriber/ defines Subscriber Protocol for ProgressEvent; TYPE_CHECKING
    # import breaks circular dep with evaluation/progress.py (Task 4).
    "a2sdlc.adapters.subscriber -> a2sdlc.evaluation.progress",
    # runner/ Protocol TYPE_CHECKING imports ProgressState for run() signature.
    "a2sdlc.adapters.runner -> a2sdlc.evaluation.progress",
    # Subscriber implementations (console, gh_actions, gh_comment) import ProgressEvent
    # and related types to implement the Subscriber protocol. These are adapters
    # that consume evaluation events (direction adapters ← evaluation). Legitimate.
    "a2sdlc.adapters.subscriber.console -> a2sdlc.evaluation.progress",
    "a2sdlc.adapters.subscriber.gh_actions -> a2sdlc.evaluation.progress",
    "a2sdlc.adapters.subscriber.gh_comment -> a2sdlc.evaluation.progress",
    "a2sdlc.adapters.subscriber.gh_comment -> a2sdlc.evaluation.throttle",
    "a2sdlc.adapters.subscriber.mlflow_trace -> a2sdlc.evaluation.progress",
]

[[tool.importlinter.contracts]]
name = "lifecycle, assembly, evaluation do not import each other or pipeline"
type = "forbidden"
source_modules = [
    "a2sdlc.lifecycle",
    "a2sdlc.assembly",
    "a2sdlc.evaluation",
]
forbidden_modules = [
    "a2sdlc.pipeline",
    "a2sdlc.cli",
]

[[tool.importlinter.contracts]]
name = "lifecycle does not import assembly or evaluation"
type = "forbidden"
source_modules = ["a2sdlc.lifecycle"]
forbidden_modules = ["a2sdlc.assembly", "a2sdlc.evaluation"]
ignore_imports = [
    # TYPE_CHECKING import in adapters.subscriber breaks the transitive
    # lifecycle → evaluation chain. The direct lifecycle.state →
    # adapters.protocols edge is legal (adapters is not in
    # forbidden_modules), so we only ignore the trailing TYPE_CHECKING hop.
    "a2sdlc.adapters.subscriber -> a2sdlc.evaluation.progress",
    "a2sdlc.adapters.runner -> a2sdlc.evaluation.progress",
]

[[tool.importlinter.contracts]]
name = "assembly does not import lifecycle or evaluation"
type = "forbidden"
source_modules = ["a2sdlc.assembly"]
forbidden_modules = ["a2sdlc.lifecycle", "a2sdlc.evaluation"]

[[tool.importlinter.contracts]]
name = "evaluation does not import lifecycle or assembly"
type = "forbidden"
source_modules = ["a2sdlc.evaluation"]
forbidden_modules = ["a2sdlc.lifecycle", "a2sdlc.assembly"]
