        -0,0 +1,250 @@\\n+# `now` CLI Input Validation Implementation Plan\\n+\\n+>
        **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development
        (recommended) or superpowers:executing-plans to implement this plan task-by-task.
        Steps use checkbox (`- [ ]`) syntax for tracking.\\n+\\n+**Goal:** Add `argparse`-based
        argument validation to `scripts/now.py` so that any unexpected CLI argument
        produces a clear error on stderr and a nonzero (2) exit code, leaving the
        normal no-arg path unchanged.\\n+\\n+**Architecture:** A single `ArgumentParser`
        instance is created at the top of `main()` with `prog=\\\"now\\\"` hardcoded
        and no arguments defined beyond the built-in `-h/--help`. Calling `parse_args()`
        causes argparse to reject any unexpected input automatically \u2014 no custom
        error handling is needed. Tests use `monkeypatch` to inject `sys.argv` and
        `pytest.raises(SystemExit)` to assert exit codes and stderr content.\\n+\\n+**Tech
        Stack:** Python 3.9+ stdlib only (`argparse` \u2014 already in stdlib, no
        new dependencies); `pytest` with `monkeypatch` and `capsys` fixtures (already
        in dev deps).\\n+\\n+---\\n+\\n+## File Map\\n+\\n+| File | Action | Responsibility
        |\\n+|---|---|---|\\n+| `scripts/now.py` | Modify | Add `import argparse`;
        add parser call at top of `main()` |\\n+| `tests/test_now.py` | Modify | Add
        four new test cases for validation behavior |\\n+\\n+---\\n+\\n+### Task 1:
        Write the failing tests\\n+\\n+**Files:**\\n+- Modify: `tests/test_now.py`\\n+\\n+These
        tests must fail before the implementation is in place.\\n+\\n+- [ ] **Step
        1: Open `tests/test_now.py` and append the four new test functions**\\n+\\n+
        \ The file currently imports `datetime`, `get_utc_now`, and `main` from `scripts.now`.
        It does NOT import `sys` or `pytest`. Make the following changes:\\n+\\n+
        \ **a) Replace the import block** (lines 1\u20133 of the current file) with
        the complete new import block:\\n+\\n+  ```python\\n+  import datetime\\n+
        \ import sys\\n+\\n+  import pytest\\n+\\n+  from scripts.now import get_utc_now,
        main\\n+  ```\\n+\\n+  **b) Update `test_main_prints_valid_datetime`** to
        monkeypatch `sys.argv`. After the argparse change is applied in Task 2, `parser.parse_args()`
        will read the real `sys.argv` at test runtime \u2014 which contains pytest's
        own invocation (e.g. `[\\\"pytest\\\", \\\"tests/test_now.py\\\", \\\"-v\\\"]`)
        \u2014 and will call `sys.exit(2)` because those are unrecognized arguments.
        To prevent this breakage, the existing test must be updated now. Replace the
        current definition of `test_main_prints_valid_datetime`:\\n+\\n+  ```python\\n+
        \ # BEFORE (current \u2014 will break after argparse is added)\\n+  def test_main_prints_valid_datetime(capsys):\\n+
        \     main()\\n+      captured = capsys.readouterr()\\n+      line = captured.out.strip()\\n+
        \     parsed = datetime.datetime.fromisoformat(line)\\n+      assert parsed.tzinfo
        is not None\\n+      assert parsed.utcoffset() == datetime.timedelta(0)\\n+
        \ ```\\n+\\n+  Replace it with:\\n+\\n+  ```python\\n+  # AFTER (monkeypatches
        sys.argv to prevent pytest's own args from being parsed)\\n+  def test_main_prints_valid_datetime(monkeypatch,
        capsys):\\n+      monkeypatch.setattr(sys, \\\"argv\\\", [\\\"now\\\"])\\n+
        \     main()\\n+      captured = capsys.readouterr()\\n+      line = captured.out.strip()\\n+
        \     parsed = datetime.datetime.fromisoformat(line)\\n+      assert parsed.tzinfo
        is not None\\n+      assert parsed.utcoffset() == datetime.timedelta(0)\\n+
        \ ```\\n+\\n+  **c) Append the four new test functions** to the end of the
        file:\\n+\\n+  ```python\\n+  def test_rejects_positional_arg(monkeypatch,
        capsys):\\n+      \\\"\\\"\\\"Unknown positional argument \u2192 exit 2 with
        message on stderr.\\\"\\\"\\\"\\n+      monkeypatch.setattr(sys, \\\"argv\\\",
        [\\\"now\\\", \\\"foo\\\"])\\n+      with pytest.raises(SystemExit) as excinfo:\\n+
        \         main()\\n+      assert excinfo.value.code == 2\\n+      captured
        = capsys.readouterr()\\n+      assert \\\"unrecognized arguments: foo\\\"
        in captured.err\\n+\\n+\\n+  def test_rejects_unknown_flag(monkeypatch, capsys):\\n+
        \     \\\"\\\"\\\"Unknown flag \u2192 exit 2 with message on stderr.\\\"\\\"\\\"\\n+
        \     monkeypatch.setattr(sys, \\\"argv\\\", [\\\"now\\\", \\\"--verbose\\\"])\\n+
        \     with pytest.raises(SystemExit) as excinfo:\\n+          main()\\n+      assert
        excinfo.value.code == 2\\n+      captured = capsys.readouterr()\\n+      assert
        \\\"unrecognized arguments: --verbose\\\" in captured.err\\n+\\n+\\n+  def
        test_rejects_multiple_bad_args(monkeypatch, capsys):\\n+      \\\"\\\"\\\"Mix
        of unknown positional and flag \u2192 exit 2 with message on stderr.\\\"\\\"\\\"\\n+
        \     monkeypatch.setattr(sys, \\\"argv\\\", [\\\"now\\\", \\\"foo\\\", \\\"--bar\\\"])\\n+
        \     with pytest.raises(SystemExit) as excinfo:\\n+          main()\\n+      assert
        excinfo.value.code == 2\\n+      captured = capsys.readouterr()\\n+      assert
        \\\"unrecognized arguments\\\" in captured.err\\n+\\n+\\n+  def test_help_exits_zero(monkeypatch,
        capsys):\\n+      \\\"\\\"\\\"--help exits 0 (not 2) \u2014 must distinguish
        from error exits.\\\"\\\"\\\"\\n+      monkeypatch.setattr(sys, \\\"argv\\\",
        [\\\"now\\\", \\\"--help\\\"])\\n+      with pytest.raises(SystemExit) as
        excinfo:\\n+          main()\\n+      assert excinfo.value.code == 0  # NOT
        2\\n+  ```\\n+\\n+- [ ] **Step 2: Run the new tests to confirm they fail**\\n+\\n+
        \ ```bash\\n+  pytest tests/test_now.py::test_rejects_positional_arg \\\\\\n+
        \        tests/test_now.py::test_rejects_unknown_flag \\\\\\n+         tests/test_now.py::test_rejects_multiple_bad_args
        \\\\\\n+         tests/test_now.py::test_help_exits_zero \\\\\\n+         -v\\n+
        \ ```\\n+\\n+  Expected output: all four tests **FAIL**. The failure reason
        will be that `main()` currently has no argument parser, so it prints a timestamp
        and returns normally instead of raising `SystemExit`. Example failure:\\n+\\n+
        \ ```\\n+  FAILED tests/test_now.py::test_rejects_positional_arg - Failed:
        DID NOT RAISE <class 'SystemExit'>\\n+  ```\\n+\\n+  If any of the four tests
        accidentally pass right now, something is wrong \u2014 stop and investigate
        before continuing.\\n+\\n+- [ ] **Step 3: Confirm existing tests still pass**\\n+\\n+
        \ ```bash\\n+  pytest tests/test_now.py -v\\n+  ```\\n+\\n+  Expected: the
        four existing tests (`test_utc_now_is_string`, `test_utc_now_parses_as_datetime`,
        `test_utc_now_is_utc`, `test_main_prints_valid_datetime`) pass; the four new
        tests fail.\\n+\\n+---\\n+\\n+### Task 2: Implement `argparse` validation
        in `main()`\\n+\\n+**Files:**\\n+- Modify: `scripts/now.py`\\n+\\n+- [ ] **Step
        1: Add `import argparse` to the module-level import block**\\n+\\n+  Open
        `scripts/now.py`. The file's import block currently reads (lines 1\u201312):\\n+
        \ ```python\\n+  \\\"\\\"\\\"Print the current UTC timestamp in ISO 8601 format.\\\"\\\"\\\"\\n+\\n+
        \ import datetime\\n+  import json\\n+  import os\\n+  import platform\\n+
        \ import time\\n+  from importlib.metadata import PackageNotFoundError\\n+
        \ from importlib.metadata import version as _pkg_version\\n+  from pathlib
        import Path\\n+\\n+  from platformdirs import user_data_dir\\n+  ```\\n+\\n+
        \ Add `import argparse` before `import datetime`, maintaining alphabetical
        stdlib order. The complete new import block is:\\n+  ```python\\n+  \\\"\\\"\\\"Print
        the current UTC timestamp in ISO 8601 format.\\\"\\\"\\\"\\n+\\n+  import
        argparse\\n+  import datetime\\n+  import json\\n+  import os\\n+  import
        platform\\n+  import time\\n+  from importlib.metadata import PackageNotFoundError\\n+
        \ from importlib.metadata import version as _pkg_version\\n+  from pathlib
        import Path\\n+\\n+  from platformdirs import user_data_dir\\n+  ```\\n+\\n+-
        [ ] **Step 2: Replace the body of `main()` to add the parser call**\\n+\\n+
        \ The current `main()` (lines 91\u201397 of `scripts/now.py`) is:\\n+  ```python\\n+
        \ def main() -> None:\\n+      \\\"\\\"\\\"Entry-point: print the UTC timestamp
        to stdout and record metrics.\\\"\\\"\\\"\\n+      start_ns = time.monotonic_ns()\\n+
        \     timestamp = get_utc_now()\\n+      print(timestamp)\\n+      duration_ms
        = (time.monotonic_ns() - start_ns) // 1_000_000\\n+      record_invocation(timestamp=timestamp,
        duration_ms=duration_ms, exit_code=0)\\n+  ```\\n+\\n+  Replace it with:\\n+
        \ ```python\\n+  def main() -> None:\\n+      \\\"\\\"\\\"Entry-point: print
        the UTC timestamp to stdout and record metrics.\\\"\\\"\\\"\\n+      parser
        = argparse.ArgumentParser(\\n+          prog=\\\"now\\\",\\n+          description=\\\"Print
        the current UTC timestamp in ISO 8601 format.\\\",\\n+      )\\n+      parser.parse_args()\\n+\\n+
        \     start_ns = time.monotonic_ns()\\n+      timestamp = get_utc_now()\\n+
        \     print(timestamp)\\n+      duration_ms = (time.monotonic_ns() - start_ns)
        // 1_000_000\\n+      record_invocation(timestamp=timestamp, duration_ms=duration_ms,
        exit_code=0)\\n+  ```\\n+\\n+  Notes:\\n+  - `prog=\\\"now\\\"` is hardcoded
        intentionally \u2014 it makes error messages read `now: error: ...` regardless
        of whether the script is invoked as the `now` entry-point or as `python scripts/now.py`.
        Do not remove it.\\n+  - No arguments are defined on `parser` \u2014 argparse
        rejects everything beyond `-h/--help` automatically.\\n+  - `parser.parse_args()`
        reads `sys.argv[1:]` implicitly; no manual plumbing is needed.\\n+  - Metrics
        (`record_invocation`) are never reached when validation fails \u2014 `parse_args()`
        calls `sys.exit(2)` before `start_ns` is set.\\n+\\n+- [ ] **Step 3: Run the
        full test suite**\\n+\\n+  ```bash\\n+  pytest tests/test_now.py -v\\n+  ```\\n+\\n+
        \ Expected: all **8 tests pass** (4 existing + 4 new).\\n+\\n+  ```\\n+  PASSED
        tests/test_now.py::test_utc_now_is_string\\n+  PASSED tests/test_now.py::test_utc_now_parses_as_datetime\\n+
        \ PASSED tests/test_now.py::test_utc_now_is_utc\\n+  PASSED tests/test_now.py::test_main_prints_valid_datetime\\n+
        \ PASSED tests/test_now.py::test_rejects_positional_arg\\n+  PASSED tests/test_now.py::test_rejects_unknown_flag\\n+
        \ PASSED tests/test_now.py::test_rejects_multiple_bad_args\\n+  PASSED tests/test_now.py::test_help_exits_zero\\n+
        \ ```\\n+\\n+  If any test fails, do not proceed \u2014 diagnose and fix before
        committing.\\n+\\n+- [ ] **Step 4: Run the full project test suite to check
        for regressions**\\n+\\n+  ```bash\\n+  pytest -v\\n+  ```\\n+\\n+  Expected:
        all tests pass. Zero failures.\\n+\\n+- [ ] **Step 5: Commit**\\n+\\n+  ```bash\\n+
        \ git add scripts/now.py tests/test_now.py\\n+  git commit -m \\\"feat: reject
        unexpected CLI args in now with argparse (#28)\\\"\\n+  ```\"},{\"sha\":\"fd690f45c49146c1c67f3c4a2402f44fa6a27f14\",\"filename\":\"docs/superpowers/specs/2026-04-22-28-input-validation.md\",\"status\":\"added\",\"additions\":124,\"deletions\":0,\"changes\":124,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/692d4aef56d5b9c33fad75c21a5cc835e32f1d32/docs%2Fsuperpowers%2Fspecs%2F2026-04-22-28-input-validation.md\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/692d4aef56d5b9c33fad75c21a5cc835e32f1d32/docs%2Fsuperpowers%2Fspecs%2F2026-04-22-28-input-validation.md\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/docs%2Fsuperpowers%2Fspecs%2F2026-04-22-28-input-validation.md?ref=692d4aef56d5b9c33fad75c21a5cc835e32f1d32\",\"patch\":\"@@
        -0,0 +1,124 @@\\n+# Spec: `now` CLI Input Validation (Ticket #28)\\n+\\n+**Date:**
        2026-04-22  \\n+**Status:** Approved  \\n+**Scope:** Add argument parsing
        to `scripts/now.py` so that unexpected CLI arguments are rejected with a clear
        error message and a nonzero exit code.\\n+\\n+---\\n+\\n+## Background\\n+\\n+`scripts/now.py`
        currently prints the current UTC timestamp and records a telemetry event.
        Its `main()` function accepts zero arguments but has no argument parser, so
        running `now foo --bar` silently ignores all extra input. This is misleading:
        a user who misremembers the interface gets no feedback.\\n+\\n+---\\n+\\n+##
        Goals\\n+\\n+1. Reject any unexpected positional argument (e.g. `now foo`)
        with an error on stderr and exit code 2.\\n+2. Reject any unexpected option/flag
        (e.g. `now --foo`) with an error on stderr and exit code 2.\\n+3. Leave the
        normal happy path (`now`, no args) completely unchanged.\\n+4. Add `-h/--help`
        (standard argparse byproduct; does not currently exist \u2014 exits 0 with
        usage).\\n+5. Do **not** add `--no-telemetry` or any other new flag \u2014
        the CLI surface stays minimal.\\n+\\n+---\\n+\\n+## Approaches Considered\\n+\\n+|
        Approach | Summary | Verdict |\\n+|---|---|---|\\n+| A \u2014 `argparse.parse_args()`
        | Standard stdlib parser; rejects unknowns automatically; error format consistent
        with system tools. | **Chosen** |\\n+| B \u2014 `sys.argv` length check |
        `if len(sys.argv) > 1: error+exit`. Minimal, but brittle \u2014 misses `--`
        handling, no consistent error format. | Rejected |\\n+| C \u2014 `parse_known_args()`
        + manual reject | More control over error message; more code with no real
        benefit over A for this scope. | Rejected |\\n+\\n+**Chosen:** Approach A
        \u2014 `argparse.ArgumentParser` with `parse_args()`.\\n+\\n+---\\n+\\n+##
        Design\\n+\\n+### `scripts/now.py` \u2014 `main()` change\\n+\\n+Add `import
        argparse` at the module level (top of file, with the other stdlib imports)
        and add a parser call at the very top of `main()`. The snippet below is the
        **complete new `main()` body**:\\n+\\n+```python\\n+# module-level import
        (add to existing import block at top of file)\\n+import argparse\\n+\\n+#
        complete replacement of main()\\n+def main() -> None:\\n+    parser = argparse.ArgumentParser(\\n+
        \       prog=\\\"now\\\",           # hardcoded so error messages read \\\"now:
        error: ...\\\" regardless\\n+                              # of whether the
        script is invoked as `now` or `python scripts/now.py`\\n+        description=\\\"Print
        the current UTC timestamp in ISO 8601 format.\\\",\\n+    )\\n+    parser.parse_args()
        \  # exits with code 2 + stderr message on any unknown arg\\n+\\n+    start_ns
        = time.monotonic_ns()\\n+    timestamp = get_utc_now()\\n+    print(timestamp)\\n+
        \   duration_ms = (time.monotonic_ns() - start_ns) // 1_000_000\\n+    record_invocation(timestamp=timestamp,
        duration_ms=duration_ms, exit_code=0)\\n+```\\n+\\n+Key properties of this
        design:\\n+- **No new arguments defined** \u2014 parser accepts nothing beyond
        `-h/--help`.\\n+- **argparse default error format** \u2014 writes `usage:
        now [-h]\\\\nnow: error: unrecognized arguments: <arg>` to stderr and exits
        2.\\n+- **`prog=\\\"now\\\"` is hardcoded** \u2014 produces stable, consistent
        error messages regardless of invocation method; do not remove.\\n+- **`-h/--help`
        exits 0** \u2014 standard behaviour; not present in the current script; added
        as an unavoidable and useful byproduct of argparse.\\n+- **Metrics are not
        recorded on bad input** \u2014 `record_invocation` is never reached when `parse_args()`
        raises `SystemExit` (the parser call is before `start_ns`).\\n+- **`sys.argv`
        is used implicitly** \u2014 `parse_args()` reads from `sys.argv[1:]` by default;
        no manual plumbing needed.\\n+\\n+### Error message examples\\n+\\n+```\\n+$
        now foo\\n+usage: now [-h]\\n+now: error: unrecognized arguments: foo\\n+```\\n+\\n+```\\n+$
        now --verbose\\n+usage: now [-h]\\n+now: error: unrecognized arguments: --verbose\\n+```\\n+\\n+```\\n+$
        now -x positional --unknown\\n+usage: now [-h]\\n+now: error: unrecognized
        arguments: -x positional --unknown\\n+```\\n+\\n+---\\n+\\n+## Test Coverage\\n+\\n+New
        tests in `tests/test_now.py` using `monkeypatch` to set `sys.argv` and `pytest.raises(SystemExit)`:\\n+\\n+|
        Test | Input `sys.argv` | Expected exit code | Expected stderr |\\n+|---|---|---|---|\\n+|
        `test_rejects_positional_arg` | `[\\\"now\\\", \\\"foo\\\"]` | 2 | contains
        \\\"unrecognized arguments: foo\\\" |\\n+| `test_rejects_unknown_flag` | `[\\\"now\\\",
        \\\"--verbose\\\"]` | 2 | contains \\\"unrecognized arguments: --verbose\\\"
        |\\n+| `test_rejects_multiple_bad_args` | `[\\\"now\\\", \\\"foo\\\", \\\"--bar\\\"]`
        | 2 | contains \\\"unrecognized arguments\\\" |\\n+| `test_help_exits_zero`
        | `[\\\"now\\\", \\\"--help\\\"]` | 0 \u2014 assert `excinfo.value.code ==
        0` to distinguish from error exits | (stdout, not checked) |\\n+| Existing
        `test_main_prints_valid_datetime` | `[\\\"now\\\"]` | 0 (implicit) | \u2014
        |\\n+\\n+**Testing approach:** Call `main()` directly (not via subprocess).
        Use `monkeypatch.setattr(sys, \\\"argv\\\", [...])` to inject args. Wrap the
        call in `pytest.raises(SystemExit) as excinfo`, then assert `excinfo.value.code
        == <expected>`. For stderr content, use `capsys.readouterr().err` \u2014 argparse
        writes to stderr before raising `SystemExit`, so capsys captures it correctly.
        The `capfd` alternative (file-descriptor level) is equally valid if `capsys`
        misses output in a specific environment, but `capsys` is simpler and preferred
        here.\\n+\\n+---\\n+\\n+## Out of Scope\\n+\\n+- `--no-telemetry` flag \u2014
        env-var-only (`NOW_NO_TELEMETRY`) remains the sole mechanism.\\n+- `--version`
        flag \u2014 no package version surfacing via CLI.\\n+- Validation of environment
        variables \u2014 `NOW_NO_TELEMETRY` is already handled correctly.\\n+- Changes
        to the metrics schema or telemetry logic.\\n+\\n+---\\n+\\n+## Acceptance
        Criteria\\n+\\n+- [ ] `now` (no args) prints a valid UTC ISO 8601 timestamp
        and exits 0 \u2014 unchanged.\\n+- [ ] `now <anything>` exits 2 with an error
        on stderr mentioning the unrecognized argument.\\n+- [ ] `now --help` exits
        0 with usage text.\\n+- [ ] All existing tests pass.\\n+- [ ] New tests covering
        rejection cases pass.\"}]"
