        add format_cost_summary helper and unit tests\",\"user\":{\"login\":\"a2sdlc[bot]\",\"id\":273219115,\"node_id\":\"BOT_kgDOEEj-Kw\",\"avatar_url\":\"https://avatars.githubusercontent.com/in/3256224?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D\",\"html_url\":\"https://github.com/apps/a2sdlc\",\"followers_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/followers\",\"following_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/subscriptions\",\"organizations_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/orgs\",\"repos_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/repos\",\"events_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/a2sdlc%5Bbot%5D/received_events\",\"type\":\"Bot\",\"user_view_type\":\"public\",\"site_admin\":false},\"body\":\"##
        What changed and why\\n\\nAdded a small standalone helper module `src/a2sdlc_smoke/cost_summary.py`
        that\\nturns a cost snapshot into a one-line human-readable string, so pipeline
        comments\\ncan say _\\\"Spent \\\\$2.14 across 3 stages\\\"_ rather than raw
        numbers.\\n\\n**New files:**\\n- `src/a2sdlc_smoke/__init__.py` \u2014 package
        marker for the new `a2sdlc_smoke` namespace\\n- `src/a2sdlc_smoke/cost_summary.py`
        \u2014 `format_cost_summary(total_usd, stages) -> str`\\n- `tests/test_cost_summary.py`
        \u2014 4 unit tests\\n\\n**Modified:**\\n- `pyproject.toml` \u2014 added `[tool.pytest.ini_options]
        pythonpath = [\\\"src\\\"]` so pytest\\n  resolves the `src/` layout; also
        added `src/a2sdlc_smoke` to hatchling wheel packages\\n  so the module is
        included in built distributions.\\n\\nNo existing code was modified. The helper
        is not wired anywhere else (out of scope per ticket).\\n\\n## What was tested\\n\\n-
        `test_single_stage` \u2014 `format_cost_summary(0.50, 1)` \u2192 `\\\"Spent
        $0.50 across 1 stage\\\"`\\n- `test_multiple_stages` \u2014 `format_cost_summary(2.14,
        3)` \u2192 `\\\"Spent $2.14 across 3 stages\\\"`\\n- `test_zero_cost_zero_stages`
        \u2014 `format_cost_summary(0.0, 0)` \u2192 `\\\"Spent $0.00 across 0 stages\\\"`\\n-
        `test_fractional_cents_rounded` \u2014 `format_cost_summary(1.999, 2)` \u2192
        `\\\"Spent $2.00 across 2 stages\\\"`\\n\\nAll 17 tests pass (4 new + 13 existing
        from `test_add`, `test_list`, `test_version`).\\nTwo rounds of code review
        completed with no Critical or Important issues remaining.\\n\\n## Ticket\\n\\nCloses
