        -0,0 +1,174 @@\\n+# Implementation Plan: Cost Summary Helper\\n+\\n+**Ticket:**
        12  \\n+**Date:** 2026-04-21  \\n+**Spec:** `docs/superpowers/specs/2026-04-21-12-cost-summary-helper.md`\\n+\\n+---\\n+\\n+##
        Overview\\n+\\n+Six sequential tasks. Each builds on the previous. No parallel
        work is\\n+needed \u2014 the module, package marker, pyproject change, tests,
        quality gate,\\n+and commit are all tightly coupled.\\n+\\n+---\\n+\\n+##
        Task 1 \u2014 Create the `a2sdlc_smoke` package marker\\n+\\n+**Files touched:**
        `src/a2sdlc_smoke/__init__.py` (new)\\n+\\n+**Steps:**\\n+1. Create the directory
        `src/a2sdlc_smoke/`.\\n+2. Write an empty `src/a2sdlc_smoke/__init__.py` (zero
        bytes or a single\\n+   module docstring \u2014 either is acceptable).\\n+\\n+**Acceptance:**
        `src/a2sdlc_smoke/__init__.py` exists on disk.\\n+\\n+---\\n+\\n+## Task 2
        \u2014 Implement `format_cost_summary`\\n+\\n+**Files touched:** `src/a2sdlc_smoke/cost_summary.py`
        (new)\\n+\\n+**Steps:**\\n+1. Create `src/a2sdlc_smoke/cost_summary.py`.\\n+2.
        Define:\\n+\\n+```python\\n+def format_cost_summary(total_usd: float, stages:
        int) -> str:\\n+    unit = \\\"stage\\\" if stages == 1 else \\\"stages\\\"\\n+
        \   return f\\\"Spent ${total_usd:.2f} across {stages} {unit}\\\"\\n+```\\n+\\n+**Acceptance:**\\n+-
        Calling `format_cost_summary(2.14, 3)` returns `\\\"Spent $2.14 across 3 stages\\\"`.\\n+-
        Calling `format_cost_summary(0.50, 1)` returns `\\\"Spent $0.50 across 1 stage\\\"`.\\n+-
        Calling `format_cost_summary(0.0, 0)` returns `\\\"Spent $0.00 across 0 stages\\\"`.\\n+\\n+---\\n+\\n+##
        Task 3 \u2014 Configure pytest to resolve the `src/` layout\\n+\\n+**Files
        touched:** `pyproject.toml` (modify)\\n+\\n+**Steps:**\\n+1. Read `pyproject.toml`.\\n+2.
        Append the following section at the end of the file:\\n+\\n+```toml\\n+[tool.pytest.ini_options]\\n+pythonpath
        = [\\\"src\\\"]\\n+```\\n+\\n+**Constraint:** Do NOT modify any existing section.
        Append only.\\n+\\n+**Acceptance:** `[tool.pytest.ini_options]` section appears
        in `pyproject.toml`\\n+with `pythonpath = [\\\"src\\\"]`. The `[dependency-groups]`
        dev section already\\n+requires `pytest>=7.0`, which supports the `pythonpath`
        key \u2014 no version change\\n+needed.\\n+\\n+---\\n+\\n+## Task 4 \u2014
        Write the unit tests\\n+\\n+**Files touched:** `tests/test_cost_summary.py`
        (new)\\n+\\n+**Steps:**\\n+1. Create `tests/test_cost_summary.py` with the
        following content:\\n+\\n+```python\\n+from a2sdlc_smoke.cost_summary import
        format_cost_summary\\n+\\n+\\n+def test_single_stage():\\n+    assert format_cost_summary(0.50,
        1) == \\\"Spent $0.50 across 1 stage\\\"\\n+\\n+\\n+def test_multiple_stages():\\n+
        \   assert format_cost_summary(2.14, 3) == \\\"Spent $2.14 across 3 stages\\\"\\n+\\n+\\n+def
        test_zero_cost_zero_stages():\\n+    assert format_cost_summary(0.0, 0) ==
        \\\"Spent $0.00 across 0 stages\\\"\\n+\\n+\\n+def test_fractional_cents_rounded():\\n+
        \   assert format_cost_summary(1.999, 2) == \\\"Spent $2.00 across 2 stages\\\"\\n+```\\n+\\n+**Notes:**\\n+-
        `1.999` formatted as `:.2f` produces `\\\"2.00\\\"` unambiguously (no\\n+
        \ floating-point half-value boundary issue).\\n+- No fixtures, no mocking,
        no imports from `patient_intake`.\\n+\\n+**Acceptance:** Four test functions
        present, import resolves via `src/`\\n+path configured in Task 3.\\n+\\n+---\\n+\\n+##
        Task 5 \u2014 Run quality gate and verify\\n+\\n+**Steps:**\\n+1. Run the
        project quality gate:\\n+\\n+```bash\\n+uv run --with pytest pytest || [ $?
        -eq 5 ]\\n+```\\n+\\n+2. Confirm:\\n+   - The four new tests in `tests/test_cost_summary.py`
        all pass (green).\\n+   - All pre-existing tests (`test_add.py`, `test_list.py`,
        `test_version.py`)\\n+     continue to pass.\\n+   - Exit code is 0.\\n+\\n+**Note
        on pre-existing test resolution:** The existing tests (`test_add.py`,\\n+`test_list.py`,
        `test_version.py`) import from `patient_intake`, which sits\\n+at the repo
        root and is installed into the project venv by hatchling (it is\\n+listed
        in `[tool.hatch.build.targets.wheel]`). Adding `pythonpath = [\\\"src\\\"]`\\n+only
        *prepends* `src/` to `sys.path`; it does not remove the installed\\n+`patient_intake`
        package. The installed package remains resolvable through\\n+the venv site-packages,
        so pre-existing tests are unaffected.\\n+\\n+**Acceptance:** Command exits
        0 with no failures and no errors.\\n+\\n+---\\n+\\n+## Task 6 \u2014 Commit\\n+\\n+**Steps:**\\n+1.
        Stage all six changed/created files (the spec and plan files were written\\n+
        \  before Task 1, so they already exist on disk):\\n+   - `src/a2sdlc_smoke/__init__.py`\\n+
        \  - `src/a2sdlc_smoke/cost_summary.py`\\n+   - `tests/test_cost_summary.py`\\n+
        \  - `pyproject.toml`\\n+   - `docs/superpowers/specs/2026-04-21-12-cost-summary-helper.md`\\n+
        \  - `docs/superpowers/plans/2026-04-21-12-cost-summary-helper.md`\\n+2. Commit
        with message:\\n+\\n+```\\n+feat(cost-summary): add format_cost_summary helper
        and unit tests\\n+```\\n+\\n+3. Push branch `agent/12` to origin.\\n+\\n+---\\n+\\n+##
        Requirement Traceability\\n+\\n+| Spec Requirement                        |
        Task |\\n+|-----------------------------------------|------|\\n+| Package
        marker `src/a2sdlc_smoke/__init__.py` | Task 1 |\\n+| Module at `src/a2sdlc_smoke/cost_summary.py`
        | Task 2 |\\n+| `format_cost_summary(total_usd, stages) -> str` | Task 2 |\\n+|
        `\\\"Spent $X.XX across N stage(s)\\\"` format | Task 2 |\\n+| Two-decimal
        dollar formatting (`:.2f`)  | Task 2 |\\n+| Pluralization (`stage` / `stages`)
        \     | Task 2 |\\n+| pytest `pythonpath` config for `src/`   | Task 3 |\\n+|
        Test: single stage                      | Task 4 |\\n+| Test: multiple stages
        \                  | Task 4 |\\n+| Test: zero cost / zero stages           |
        Task 4 |\\n+| Test: fractional cents rounded          | Task 4 |\\n+| All
        existing tests still pass           | Task 5 |\\n+| No changes to `patient_intake/`
        \        | (enforced by scope \u2014 not touched) |\"},{\"sha\":\"193dd940b2f91dfa328bf933b22deb7c42bda81e\",\"filename\":\"docs/superpowers/specs/2026-04-21-12-cost-summary-helper.md\",\"status\":\"added\",\"additions\":150,\"deletions\":0,\"changes\":150,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/681cd1f89a16265d6a4b5d904519859adbb212c5/docs%2Fsuperpowers%2Fspecs%2F2026-04-21-12-cost-summary-helper.md\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/681cd1f89a16265d6a4b5d904519859adbb212c5/docs%2Fsuperpowers%2Fspecs%2F2026-04-21-12-cost-summary-helper.md\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/docs%2Fsuperpowers%2Fspecs%2F2026-04-21-12-cost-summary-helper.md?ref=681cd1f89a16265d6a4b5d904519859adbb212c5\",\"patch\":\"@@
        -0,0 +1,150 @@\\n+# Spec: Cost Summary Helper\\n+\\n+**Ticket:** 12  \\n+**Date:**
        2026-04-21  \\n+**Feature:** `format_cost_summary` \u2014 human-readable cost
        string\\n+\\n+---\\n+\\n+## 1. Overview\\n+\\n+Add a standalone helper function
        that converts a numeric cost snapshot into a\\n+single human-readable line
        suitable for embedding in live CI/pipeline comments\\n+(e.g. \\\"Spent $2.14
        across 3 stages\\\").\\n+\\n+---\\n+\\n+## 2. Module Location\\n+\\n+```\\n+src/a2sdlc_smoke/__init__.py
        \      (empty marker \u2014 new file)\\n+src/a2sdlc_smoke/cost_summary.py
        \ (implementation \u2014 new file)\\n+tests/test_cost_summary.py         (unit
        tests \u2014 new file)\\n+```\\n+\\n+The `src/` layout is new to this repo.
        The existing `patient_intake` package\\n+lives at the project root. No changes
        to `patient_intake` are required.\\n+\\n+---\\n+\\n+## 3. Function Specification\\n+\\n+###
        Signature\\n+\\n+```python\\n+def format_cost_summary(total_usd: float, stages:
        int) -> str:\\n+```\\n+\\n+### Inputs\\n+\\n+| Parameter   | Type    | Constraints
        \        |\\n+|-------------|---------|---------------------|\\n+| `total_usd`
        | `float` | Any finite float \u2265 0 |\\n+| `stages`    | `int`   | Any non-negative
        int |\\n+\\n+### Output\\n+\\n+A single string matching the pattern:\\n+\\n+```\\n+Spent
        $<amount> across <N> <unit>\\n+```\\n+\\n+Where:\\n+- `<amount>` is `total_usd`
        formatted to **exactly two decimal places** using\\n+  Python's `:.2f` format
        specifier (e.g. `0.00`, `2.14`, `10.50`).\\n+- `<N>` is the integer `stages`
        (e.g. `0`, `1`, `3`).\\n+- `<unit>` is `\\\"stage\\\"` when `stages == 1`,
        `\\\"stages\\\"` in all other cases\\n+  (including 0 and values > 1).\\n+\\n+###
        Examples\\n+\\n+| `total_usd` | `stages` | Result                           |\\n+|-------------|----------|----------------------------------|\\n+|
        `2.14`      | `3`      | `\\\"Spent $2.14 across 3 stages\\\"`  |\\n+| `0.50`
        \     | `1`      | `\\\"Spent $0.50 across 1 stage\\\"`   |\\n+| `0.0`       |
        `0`      | `\\\"Spent $0.00 across 0 stages\\\"`  |\\n+| `1.999`     | `2`
        \     | `\\\"Spent $2.00 across 2 stages\\\"`  |\\n+| `0.001`     | `1`      |
        `\\\"Spent $0.00 across 1 stage\\\"`   |\\n+\\n+### Rounding\\n+\\n+Python's
        `:.2f` format specifier is used directly. The underlying `float`\\n+representation
        introduces binary floating-point errors before formatting, so\\n+rounding
        at exact half-cent boundaries (e.g. `1.005`) is not guaranteed to\\n+be consistent
        across platforms. The test suite must only assert on values\\n+whose two-decimal
        result is unambiguous (e.g. `1.999 \u2192 2.00`, `0.001 \u2192 0.00`).\\n+No
        explicit `round()` call is needed.\\n+\\n+---\\n+\\n+## 4. Package Structure
        & Import Configuration\\n+\\n+### New files\\n+\\n+```\\n+src/\\n+  a2sdlc_smoke/\\n+
        \   __init__.py        # empty\\n+    cost_summary.py    # format_cost_summary
        implementation\\n+```\\n+\\n+### `pyproject.toml` changes\\n+\\n+Add a `[tool.pytest.ini_options]`
        section to place `src/` on `sys.path`\\n+during test discovery, so `from a2sdlc_smoke.cost_summary
        import ...` resolves:\\n+\\n+```toml\\n+[tool.pytest.ini_options]\\n+pythonpath
        = [\\\"src\\\"]\\n+```\\n+\\n+**Prerequisite:** `pythonpath` is a pytest feature
        added in pytest 7.0. The\\n+existing `pyproject.toml` already constrains `pytest>=7.0`
        under\\n+`[dependency-groups] dev`, so this is satisfied. No version bump
        is needed.\\n+\\n+No changes to `[tool.hatch.build.targets.wheel]` are required.
        The `src/`\\n+layout does not need the package installed \u2014 pytest's `pythonpath`
        setting\\n+injects `src/` into `sys.path` at collection time, making the import
        work\\n+without `a2sdlc_smoke` being registered as a wheel package.\\n+\\n+---\\n+\\n+##
        5. Unit Tests\\n+\\n+File: `tests/test_cost_summary.py`\\n+\\n+### Required
        test cases\\n+\\n+| Test name                          | Inputs                   |
        Expected output                         |\\n+|------------------------------------|--------------------------|------------------------------------------|\\n+|
        `test_single_stage`                | `(0.50, 1)`             | `\\\"Spent
        $0.50 across 1 stage\\\"`          |\\n+| `test_multiple_stages`             |
        `(2.14, 3)`             | `\\\"Spent $2.14 across 3 stages\\\"`         |\\n+|
        `test_zero_cost_zero_stages`       | `(0.0, 0)`              | `\\\"Spent
        $0.00 across 0 stages\\\"`         |\\n+| `test_fractional_cents_rounded`
        \   | `(1.999, 2)`            | `\\\"Spent $2.00 across 2 stages\\\"`         |\\n+\\n+Additional
        coverage recommended but not mandated:\\n+- `(0.001, 1)` \u2192 `\\\"Spent
        $0.00 across 1 stage\\\"` (rounds down)\\n+- `(10.505, 5)` \u2192 implementation-defined
        (binary float representation; do not assert this value)\\n+\\n+### Test structure\\n+\\n+Tests
        use plain `assert` \u2014 no fixtures required. No mocking needed.\\n+\\n+---\\n+\\n+##
        6. Out of Scope\\n+\\n+- Wiring `format_cost_summary` into any existing pipeline
        code.\\n+- Currency symbols other than `$`.\\n+- Negative cost values (undefined
        behavior \u2014 no validation required).\\n+- Locale-aware formatting (always
        uses `.` as decimal separator).\\n+\\n+---\\n+\\n+## 7. Acceptance Criteria\\n+\\n+1.
        `src/a2sdlc_smoke/cost_summary.py` exists and exports `format_cost_summary`.\\n+2.
        All four required test cases in `tests/test_cost_summary.py` pass.\\n+3. `uv
        run --with pytest pytest` exits 0 (existing tests continue to pass).\\n+4.
        No changes to `patient_intake/` or existing tests.\"},{\"sha\":\"761942c416dabb2fa8924c2cbc3283afc7bab62c\",\"filename\":\"pyproject.toml\",\"status\":\"modified\",\"additions\":4,\"deletions\":1,\"changes\":5,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/681cd1f89a16265d6a4b5d904519859adbb212c5/pyproject.toml\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/681cd1f89a16265d6a4b5d904519859adbb212c5/pyproject.toml\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/pyproject.toml?ref=681cd1f89a16265d6a4b5d904519859adbb212c5\",\"patch\":\"@@
        -16,7 +16,10 @@ dependencies = [\\n patient-intake = \\\"patient_intake.cli:main\\\"\\n
        \\n [tool.hatch.build.targets.wheel]\\n-packages = [\\\"patient_intake\\\"]\\n+packages
        = [\\\"patient_intake\\\", \\\"src/a2sdlc_smoke\\\"]\\n \\n [dependency-groups]\\n
        dev = [\\\"pytest>=7.0\\\"]\\n+\\n+[tool.pytest.ini_options]\\n+pythonpath
        = [\\\"src\\\"]\"},{\"sha\":\"77f7751e1d4d3ea34a041766b97714bb4214c106\",\"filename\":\"src/a2sdlc_smoke/__init__.py\",\"status\":\"added\",\"additions\":1,\"deletions\":0,\"changes\":1,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/681cd1f89a16265d6a4b5d904519859adbb212c5/src%2Fa2sdlc_smoke%2F__init__.py\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/681cd1f89a16265d6a4b5d904519859adbb212c5/src%2Fa2sdlc_smoke%2F__init__.py\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/src%2Fa2sdlc_smoke%2F__init__.py?ref=681cd1f89a16265d6a4b5d904519859adbb212c5\",\"patch\":\"@@
        -0,0 +1 @@\\n+\\\"\\\"\\\"a2sdlc_smoke \u2014 smoke-test helpers for the A2SDLC
        pipeline.\\\"\\\"\\\"\"},{\"sha\":\"98454903b1e48de0b3fcf794fe436643f59bfcd8\",\"filename\":\"src/a2sdlc_smoke/cost_summary.py\",\"status\":\"added\",\"additions\":15,\"deletions\":0,\"changes\":15,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/681cd1f89a16265d6a4b5d904519859adbb212c5/src%2Fa2sdlc_smoke%2Fcost_summary.py\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/681cd1f89a16265d6a4b5d904519859adbb212c5/src%2Fa2sdlc_smoke%2Fcost_summary.py\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/src%2Fa2sdlc_smoke%2Fcost_summary.py?ref=681cd1f89a16265d6a4b5d904519859adbb212c5\",\"patch\":\"@@
        -0,0 +1,15 @@\\n+\\\"\\\"\\\"Human-readable cost summary formatting for A2SDLC
        pipeline comments.\\\"\\\"\\\"\\n+\\n+\\n+def format_cost_summary(total_usd:
        float, stages: int) -> str:\\n+    \\\"\\\"\\\"Return a one-line summary of
        pipeline cost.\\n+\\n+    Args:\\n+        total_usd: Total cost in US dollars.\\n+
        \       stages: Number of pipeline stages executed.\\n+\\n+    Returns:\\n+
        \       A string like ``\\\"Spent $2.14 across 3 stages\\\"``.\\n+    \\\"\\\"\\\"\\n+
        \   unit = \\\"stage\\\" if stages == 1 else \\\"stages\\\"\\n+    return
        f\\\"Spent ${total_usd:.2f} across {stages} {unit}\\\"\"},{\"sha\":\"0a64d5f805f28f83a42088a5f528ad4d70747e14\",\"filename\":\"tests/test_cost_summary.py\",\"status\":\"added\",\"additions\":17,\"deletions\":0,\"changes\":17,\"blob_url\":\"https://github.com/iorlas/a2sdlc-smoke/blob/681cd1f89a16265d6a4b5d904519859adbb212c5/tests%2Ftest_cost_summary.py\",\"raw_url\":\"https://github.com/iorlas/a2sdlc-smoke/raw/681cd1f89a16265d6a4b5d904519859adbb212c5/tests%2Ftest_cost_summary.py\",\"contents_url\":\"https://api.github.com/repos/iorlas/a2sdlc-smoke/contents/tests%2Ftest_cost_summary.py?ref=681cd1f89a16265d6a4b5d904519859adbb212c5\",\"patch\":\"@@
        -0,0 +1,17 @@\\n+from a2sdlc_smoke.cost_summary import format_cost_summary\\n+\\n+\\n+def
        test_single_stage():\\n+    assert format_cost_summary(0.50, 1) == \\\"Spent
        $0.50 across 1 stage\\\"\\n+\\n+\\n+def test_multiple_stages():\\n+    assert
        format_cost_summary(2.14, 3) == \\\"Spent $2.14 across 3 stages\\\"\\n+\\n+\\n+def
        test_zero_cost_zero_stages():\\n+    assert format_cost_summary(0.0, 0) ==
        \\\"Spent $0.00 across 0 stages\\\"\\n+\\n+\\n+def test_fractional_cents_rounded():\\n+
        \   assert format_cost_summary(1.999, 2) == \\\"Spent $2.00 across 2 stages\\\"\"}]"
