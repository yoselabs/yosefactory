        N stage(s)\\\"` with two-decimal\\n  dollars and pluralization (`stage` vs
        `stages`).\\n- Unit tests under `tests/test_cost_summary.py` covering:\\n
        \ - single stage\\n  - multiple stages\\n  - zero cost / zero stages\\n  -
        fractional cents rounded to two decimals\\n\\n## Out of scope\\n\\n- Wiring
        the helper anywhere else \u2014 this is a standalone addition.\\n- Any currency
