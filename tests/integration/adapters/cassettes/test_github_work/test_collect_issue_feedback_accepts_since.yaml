        Goal\\n\\nAdd a small helper in `src/a2sdlc_smoke/cost_summary.py` that turns
        a\\ncost snapshot into a one-line human-readable string, so live comments\\ncan
        say \\\"Spent $2.14 across 3 stages\\\" rather than raw numbers.\\n\\n## Requirements\\n\\n-
        Module path: `src/a2sdlc_smoke/cost_summary.py`\\n- Function: `format_cost_summary(total_usd:
