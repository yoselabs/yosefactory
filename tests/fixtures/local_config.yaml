# Sample .a2sdlc/config.yaml for the local runner.
# Every top-level key here must appear in config._ALLOWED_TOP_LEVEL_KEYS.

model: claude-sonnet-4-6
default_base: main

# max_turns_per_stage, resume, timeouts — reserved for future tasks

adapters:
  work: local_file
  review: local_noop
  git: local_branch
  progress: console

quality:
  check_command: make check

spec:
  self_answer: false

gates:
  merge: human
  spec: auto

stages: {}
