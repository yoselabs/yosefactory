# .github/workflows/a2sdlc-split.yml (in the TARGET repo)
name: a2sdlc-split

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_hmac:
        required: true
        type: string
      dispatcher_url:
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: main
      ticket_body:
        required: false
        type: string
        default: ""
      trigger_stage:
        required: false
        type: string
        default: "spec"

jobs:
  engine:
    uses: yoselabs/a2sdlc-engine/.github/workflows/run-split.yml@main
    with:
      ticket_key: ${{ inputs.ticket_key }}
      run_id: ${{ inputs.run_id }}
      run_hmac: ${{ inputs.run_hmac }}
      dispatcher_url: ${{ inputs.dispatcher_url }}
      base_branch: ${{ inputs.base_branch }}
      ticket_body: ${{ inputs.ticket_body }}
      trigger_stage: ${{ inputs.trigger_stage }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
