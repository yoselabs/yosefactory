repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (staged python)
        entry: uv run ruff check --force-exclude
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: true
        always_run: false
      - id: ty
        name: ty check (src)
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        always_run: true
      - id: shelf-guard
        name: forbid local shelf source
        entry: make guard
        language: system
        pass_filenames: false
        always_run: true
