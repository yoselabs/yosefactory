[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2sdlc-engine"
version = "0.1.0"
description = "a2sdlc engine — per-ticket pipeline (SPEC → IMPLEMENT → REVIEW → MERGE)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.50",
    "pydantic>=2.0",
    "rich>=14.0",
    "PyGithub>=2.6",
    "gitpython>=3.1",
    "tenacity>=8.0",
    "python-ulid>=2.0",
    "mlflow>=2.15",
    "typer>=0.24.1",
]

[project.scripts]
a2sdlc = "a2sdlc.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2sdlc"]
